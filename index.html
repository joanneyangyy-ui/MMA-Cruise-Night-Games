
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0a0f2e;
    --gold: #f5c842;
    --gold-dim: #c9a020;
    --teal: #00c9a7;
    --card-bg: rgba(255,255,255,0.05);
    --card-border: rgba(255,255,255,0.1);
    --text: #f0f0f0;
    --muted: rgba(240,240,240,0.55);
  }

  body { background: transparent; font-family: 'DM Sans', sans-serif; color: var(--text); }

  .app {
    background: linear-gradient(140deg, #0a0f2e 0%, #0d1a3a 60%, #091828 100%);
    border-radius: 16px;
    padding: 28px 24px 32px;
    min-height: 560px;
    position: relative;
    overflow: hidden;
  }

  .app::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;

    background: radial-gradient(circle, rgba(0,201,167,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .app::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -60px;
    width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(245,200,66,0.09) 0%, transparent 70%);
    pointer-events: none;
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .header .eyebrow {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 4px;
  }
  .header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    line-height: 1.1;
  }
  .header h1 span { color: var(--gold); }

  .tabs {
    display: flex;

  .tab.active {
    background: var(--gold);
    color: #0a0f2e;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  /* WORD GENERATOR */
  .category-grid {
    display: grid;

  }
  .cat-btn {

    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;

  }
  .cat-btn.selected {
    border-color: var(--teal);

  }

  .word-display {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 28px 20px;
    text-align: center;
    margin-bottom: 16px;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

  }
  .word-category-tag {
    position: absolute;
    top: 12px; left: 14px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--teal);
    opacity: 0.8;
  }
  .word-term {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 8px;
    line-height: 1.15;
  }
  .word-hint {
    font-size: 13px;
    color: var(--muted);

    line-height: 1.5;
  }
  .word-difficulty {
    display: flex;
    gap: 3px;
    margin-top: 10px;
  }
  .diff-dot {
    width: 7px; height: 7px;

    background: var(--card-border);
  }
  .diff-dot.lit { background: var(--gold); }

  .gen-btn {
    width: 100%;
    padding: 13px;
    background: var(--gold);
    color: #0a0f2e;
    border: none;
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.5px;
  }
  .gen-btn:hover { background: #f0be20; transform: translateY(-1px); }
  .gen-btn:active { transform: translateY(0); }
  .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .loading-bar {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.08);

  }
  .loading-bar.active { display: block; }
  .loading-bar-fill {
    height: 100%;

    border-radius: 2px;

  }
  @keyframes loadBar {
    0% { width: 0%; margin-left: 0; }
    50% { width: 60%; margin-left: 20%; }
    100% { width: 0%; margin-left: 100%; }
  }

  /* SCOREBOARD */
  .score-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .score-header h2 {
    font-family: 'Syne', sans-serif;

    font-weight: 700;
  }
  .round-badge {
    background: rgba(0,201,167,0.15);
    border: 1px solid rgba(0,201,167,0.3);

    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
  }

  .team-row {
    display: flex;
    align-items: center;

  }
  .team-row.leader {

  }
  .team-rank {

    font-size: 13px;
    font-weight: 700;

    text-align: center;
  }
  .team-row.leader .team-rank { color: var(--gold); }
  .team-name {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
  }
  .team-score-bar {
    flex: 2;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
  }
  .team-score-fill {
    height: 100%;

    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    min-width: 32px;
    text-align: right;
  }

  .score-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
  }
  .score-ctrl-btn {
    padding: 9px 8px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .score-ctrl-btn:hover { border-color: var(--teal); color: var(--teal); }
  .score-ctrl-btn.danger:hover { border-color: #ff6b6b; color: #ff6b6b; }

  /* TIMER */
  .timer-wrap {
    text-align: center;
    padding: 20px 0 10px;
  }
  .timer-face {
    font-family: 'Syne', sans-serif;
    font-size: 64px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 6px;
    transition: color 0.3s;
  }
  .timer-face.urgent { color: #ff6b6b; }
  .timer-label { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .timer-presets {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .preset-btn {
    padding: 7px 16px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--muted);
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }
  .preset-btn:hover, .preset-btn.selected {
    border-color: var(--teal);
    color: var(--teal);
    background: rgba(0,201,167,0.1);
  }

  .timer-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .t-btn {
    padding: 11px 28px;
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }
  .t-btn.primary { background: var(--teal); color: #0a0f2e; }
  .t-btn.primary:hover { background: #00b898; }
  .t-btn.secondary { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); }
  .t-btn.secondary:hover { border-color: var(--muted); }

  .timer-ring {
    position: relative;
    width: 140px;
    height: 140px;
    margin: 0 auto 14px;
  }
  .timer-ring svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: rgba(255,255,255,0.07); stroke-width: 6; }
  .ring-fill { fill: none; stroke: var(--teal); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke 0.3s; }
  .ring-fill.urgent { stroke: #ff6b6b; }
  .timer-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
</style>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">MMA Cruise Night Game — AI Word Generator, Scoreboard, and Timer</h2>

<div class="app">
  <div class="header">
    <div class="eyebrow">Queen's MMA · Cruise Night</div>
    <h1>AI Says… <span>What?</span></h1>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('words')">Word Generator</button>
    <button class="tab" onclick="switchTab('score')">Scoreboard</button>
    <button class="tab" onclick="switchTab('timer')">Timer</button>
  </div>

  <!-- WORD GENERATOR PANEL -->
  <div class="panel active" id="panel-words">
    <div class="category-grid">
      <button class="cat-btn selected" data-cat="Statistics">Statistics</button>
      <button class="cat-btn selected" data-cat="Machine Learning">Machine Learning</button>
      <button class="cat-btn selected" data-cat="Finance">Finance</button>
      <button class="cat-btn selected" data-cat="Strategy">Strategy</button>
      <button class="cat-btn selected" data-cat="Data Viz">Data Viz</button>
      <button class="cat-btn selected" data-cat="Business">Business</button>
    </div>
    <div class="loading-bar" id="loadBar"><div class="loading-bar-fill"></div></div>
    <div class="word-display" id="wordDisplay">
      <div class="word-category-tag" id="wordCatTag"></div>
      <div class="word-term" id="wordTerm">Press Generate!</div>
      <div class="word-hint" id="wordHint">Pick your categories above, then tap to get an AI-generated MMA term for the team to guess.</div>
      <div class="word-difficulty" id="diffDots"></div>
    </div>
    <button class="gen-btn" id="genBtn" onclick="generateWord()">⚡ Generate Term</button>
  </div>

  <!-- SCOREBOARD PANEL -->
  <div class="panel" id="panel-score">
    <div class="score-header">
      <h2>Scoreboard</h2>
      <span class="round-badge" id="roundBadge">Round 1</span>
    </div>
    <div id="teamList"></div>
    <div class="score-controls">
      <button class="score-ctrl-btn" onclick="addPoint()">＋ Point to Team</button>
      <button class="score-ctrl-btn" onclick="nextRound()">Next Round →</button>
      <button class="score-ctrl-btn" onclick="addBonus()">★ Bonus Point</button>
      <button class="score-ctrl-btn danger" onclick="resetScores()">↺ Reset All</button>
    </div>

  <!-- TIMER PANEL -->
  <div class="panel" id="panel-timer">
    <div class="timer-wrap">
      <div class="timer-ring">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="ring-bg" cx="70" cy="70" r="62"/>
          <circle class="ring-fill" id="ringFill" cx="70" cy="70" r="62"
            stroke-dasharray="389.6" stroke-dashoffset="0"/>
        </svg>
        <div class="timer-center">
          <div class="timer-face" id="timerFace">0:30</div>
        </div>
      </div>
      <div class="timer-label" id="timerLabel">Choose a duration and start</div>
      <div class="timer-presets">
        <button class="preset-btn selected" onclick="setTimer(30, this)">30s</button>
        <button class="preset-btn" onclick="setTimer(60, this)">60s</button>
        <button class="preset-btn" onclick="setTimer(90, this)">90s</button>
        <button class="preset-btn" onclick="setTimer(120, this)">2m</button>
      </div>
      <div class="timer-btns">
        <button class="t-btn primary" id="startBtn" onclick="toggleTimer()">Start</button>
        <button class="t-btn secondary" onclick="resetTimer()">Reset</button>
      </div>
    </div>
  </div>
</div>

<script>
const WORDS = {
  "Statistics": [
    { term: "Heteroscedasticity", hint: "When the spread of residuals isn't constant across all levels of a predictor", diff: 3 },
    { term: "Multicollinearity", hint: "When two or more predictors in a regression are highly correlated with each other", diff: 3 },
    { term: "Central Limit Theorem", hint: "The reason sample means tend to be normally distributed, regardless of the population shape", diff: 2 },
    { term: "P-Value", hint: "The probability of observing your result (or more extreme) if the null hypothesis were true", diff: 1 },
    { term: "Confidence Interval", hint: "A range of values likely to contain the true population parameter", diff: 1 },
    { term: "Type I Error", hint: "Rejecting a true null hypothesis — a false alarm", diff: 2 },
    { term: "Bayesian Inference", hint: "Updating your beliefs about a hypothesis as new evidence arrives", diff: 2 },
    { term: "Standard Deviation", hint: "Measures how spread out values are from the mean", diff: 1 },
    { term: "Regression to the Mean", hint: "Extreme results tend to be followed by more average ones", diff: 2 },
    { term: "Autocorrelation", hint: "When a variable is correlated with its own past values", diff: 2 },
  ],
  "Machine Learning": [
    { term: "Overfitting", hint: "When a model learns the training data too well and fails on new data", diff: 1 },
    { term: "Gradient Descent", hint: "An optimization method that iteratively adjusts parameters to minimize a loss function", diff: 2 },
    { term: "Random Forest", hint: "An ensemble of decision trees that vote on the final prediction", diff: 2 },
    { term: "Regularization", hint: "Adding a penalty term to prevent a model from becoming too complex", diff: 2 },
    { term: "Feature Engineering", hint: "The process of creating or transforming input variables to improve model performance", diff: 2 },
    { term: "Cross-Validation", hint: "Splitting data into folds to estimate model performance on unseen data", diff: 1 },
    { term: "Confusion Matrix", hint: "A table showing how often a classifier's predictions matched actual labels", diff: 1 },
    { term: "Neural Network", hint: "A model loosely inspired by the brain, made of layers of interconnected nodes", diff: 1 },
    { term: "Bias-Variance Tradeoff", hint: "The tension between a model being too simple vs. too specific", diff: 2 },
    { term: "Dimensionality Reduction", hint: "Compressing many features into fewer while retaining key information", diff: 2 },
  ],
  "Finance": [
    { term: "WACC", hint: "The blended cost of a company's debt and equity financing", diff: 2 },
    { term: "NPV", hint: "The present value of future cash flows minus the initial investment", diff: 1 },
    { term: "Black-Scholes Model", hint: "A formula for pricing European options using volatility and time", diff: 3 },
    { term: "Arbitrage", hint: "Profiting from price differences of the same asset in different markets", diff: 2 },
    { term: "Sharpe Ratio", hint: "Measures return earned per unit of risk taken", diff: 2 },
    { term: "Duration", hint: "Measures a bond's sensitivity to interest rate changes", diff: 2 },
    { term: "Beta", hint: "A stock's volatility relative to the overall market", diff: 1 },
    { term: "Yield Curve", hint: "A graph of bond yields across different maturity lengths", diff: 1 },
    { term: "Monte Carlo Simulation", hint: "Using random sampling to model the probability of different outcomes", diff: 2 },
    { term: "Capital Structure", hint: "The mix of debt and equity a company uses to finance itself", diff: 1 },
  ],
  "Strategy": [
    { term: "Porter's Five Forces", hint: "A framework analyzing competitive pressure from suppliers, buyers, rivals, substitutes, and new entrants", diff: 1 },
    { term: "Blue Ocean Strategy", hint: "Creating uncontested market space rather than competing in crowded ones", diff: 1 },
    { term: "Competitive Moat", hint: "A durable advantage that protects a business from rivals", diff: 1 },
    { term: "First-Mover Advantage", hint: "The benefit of being the first company to enter a new market", diff: 1 },
    { term: "Disruptive Innovation", hint: "When a simpler, cheaper product eventually displaces an established one", diff: 2 },
    { term: "Value Chain", hint: "The sequence of activities that create and deliver a product's value", diff: 1 },
    { term: "Core Competency", hint: "A unique capability a company has that gives it a competitive edge", diff: 1 },
    { term: "Network Effects", hint: "When a product becomes more valuable as more people use it", diff: 1 },
    { term: "Scenario Planning", hint: "Developing multiple plausible futures to stress-test strategy", diff: 2 },
    { term: "Game Theory", hint: "Analyzing strategic decisions where the outcome depends on others' choices", diff: 2 },
  ],
  "Data Viz": [
    { term: "Heatmap", hint: "A grid where colors represent the magnitude of values across two dimensions", diff: 1 },
    { term: "Box Plot", hint: "Shows the median, quartiles, and outliers of a distribution", diff: 1 },
    { term: "Sankey Diagram", hint: "A flow diagram where the width of arrows shows the quantity being transferred", diff: 2 },
    { term: "Scatter Plot", hint: "Reveals the relationship between two continuous variables as dots", diff: 1 },
    { term: "Treemap", hint: "Nested rectangles where size represents magnitude — great for hierarchical data", diff: 2 },
    { term: "Histogram", hint: "Groups continuous data into bins to show its distribution", diff: 1 },
    { term: "Waterfall Chart", hint: "Shows how individual positive and negative values contribute to a total", diff: 2 },
    { term: "Dashboard", hint: "A visual display of the most important KPIs and metrics in one place", diff: 1 },
    { term: "Choropleth Map", hint: "A map where regions are shaded by a data variable", diff: 3 },
    { term: "Radar Chart", hint: "Displays multivariate data on axes radiating from a center point", diff: 2 },
  ],
  "Business": [
    { term: "Churn Rate", hint: "The percentage of customers who stop using a product in a given period", diff: 1 },
    { term: "Unit Economics", hint: "The revenue and costs directly tied to a single customer or transaction", diff: 1 },
    { term: "KPI", hint: "A measurable value that shows how effectively a company is hitting key objectives", diff: 1 },
    { term: "Go-to-Market Strategy", hint: "The plan for launching a product and reaching target customers", diff: 1 },
    { term: "Agile", hint: "An iterative approach to project management emphasizing flexibility and fast feedback", diff: 1 },
    { term: "OKRs", hint: "A goal-setting framework with aspirational objectives and measurable key results", diff: 1 },
    { term: "Total Addressable Market", hint: "The total revenue opportunity available if a product captured 100% of its market", diff: 2 },
    { term: "Economies of Scale", hint: "Cost advantages gained by producing at a larger volume", diff: 1 },
    { term: "Pivot", hint: "Shifting a business model or strategy based on new information", diff: 1 },
    { term: "Vertical Integration", hint: "Owning multiple stages of the supply chain within one company", diff: 2 },
  ]
};

const TEAMS = ["Team Alpha","Team Beta","Team Gamma","Team Delta","Team Epsilon","Team Zeta","Team Eta","Team Theta"];
let scores = TEAMS.map(() => 0);
let round = 1;
let selectedCats = new Set(["Statistics","Machine Learning","Finance","Strategy","Data Viz","Business"]);
let usedWords = new Set();

// Category toggle
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const cat = btn.dataset.cat;
    if (selectedCats.has(cat)) {
      if (selectedCats.size > 1) { selectedCats.delete(cat); btn.classList.remove('selected'); }
    } else {
      selectedCats.add(cat); btn.classList.add('selected');
    }
  });
});

function generateWord() {
  const btn = document.getElementById('genBtn');
  const bar = document.getElementById('loadBar');
  btn.disabled = true;
  bar.classList.add('active');

  const cats = [...selectedCats];
  const pool = [];
  cats.forEach(c => WORDS[c].forEach(w => pool.push({...w, cat: c})));
  const fresh = pool.filter(w => !usedWords.has(w.term));
  const source = fresh.length > 0 ? fresh : pool;
  const pick = source[Math.floor(Math.random() * source.length)];
  usedWords.add(pick.term);

  setTimeout(() => {
    bar.classList.remove('active');
    btn.disabled = false;
    document.getElementById('wordCatTag').textContent = pick.cat;
    document.getElementById('wordTerm').textContent = pick.term;
    document.getElementById('wordHint').textContent = pick.hint;
    const dots = document.getElementById('diffDots');
    dots.innerHTML = [1,2,3].map(i => `<div class="diff-dot${i <= pick.diff ? ' lit' : ''}"></div>`).join('');
  }, 900);
}

// Scoreboard
function renderScores() {
  const sorted = scores.map((s,i) => ({name: TEAMS[i], score: s, idx: i})).sort((a,b) => b.score - a.score);
  const max = Math.max(...scores, 1);
  document.getElementById('teamList').innerHTML = sorted.map((t, rank) => `
    <div class="team-row${rank===0 && t.score>0?' leader':''}">
      <div class="team-rank">${rank+1}</div>
      <div class="team-name">${t.name}</div>
      <div class="team-score-bar"><div class="team-score-fill" style="width:${Math.round((t.score/max)*100)}%"></div></div>
      <div class="team-pts">${t.score}</div>
    </div>
  `).join('');
  document.getElementById('roundBadge').textContent = `Round ${round}`;
}
renderScores();

function addPoint() {
  const name = prompt("Which team scored? (e.g. Alpha, Beta...)");
  if (!name) return;
  const idx = TEAMS.findIndex(t => t.toLowerCase().includes(name.toLowerCase()));
  if (idx >= 0) { scores[idx]++; renderScores(); }
  else alert("Team not found. Try: Alpha, Beta, Gamma, Delta, Epsilon, Zeta, Eta, Theta");
}
function addBonus() {
  const name = prompt("Bonus point for which team?");
  if (!name) return;
  const idx = TEAMS.findIndex(t => t.toLowerCase().includes(name.toLowerCase()));
  if (idx >= 0) { scores[idx] += 2; renderScores(); }
  else alert("Team not found.");
}
function nextRound() { round++; renderScores(); }
function resetScores() {
  if (confirm("Reset all scores and rounds?")) { scores = TEAMS.map(() => 0); round = 1; usedWords.clear(); renderScores(); }
}

// Timer
let totalSecs = 30, remaining = 30, timerRunning = false, timerInterval = null;
const CIRC = 2 * Math.PI * 62;

function setTimer(secs, el) {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  totalSecs = secs; remaining = secs;
  if (timerRunning) { clearInterval(timerInterval); timerRunning = false; document.getElementById('startBtn').textContent = 'Start'; }
  updateTimerDisplay();
}
function updateTimerDisplay() {
  const m = Math.floor(remaining/60), s = remaining%60;
  const face = document.getElementById('timerFace');
  const ring = document.getElementById('ringFill');
  const label = document.getElementById('timerLabel');
  face.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  const offset = CIRC * (1 - remaining/totalSecs);
  ring.style.strokeDashoffset = offset;
  const urgent = remaining <= 10 && remaining > 0;
  face.className = 'timer-face' + (urgent ? ' urgent' : '');
  ring.className = 'ring-fill' + (urgent ? ' urgent' : '');
  label.textContent = timerRunning ? (remaining > 0 ? 'Time is ticking...' : "Time's up! 🎉") : (remaining === totalSecs ? 'Choose a duration and start' : 'Paused');
}
function toggleTimer() {
  const btn = document.getElementById('startBtn');
  if (timerRunning) {
    clearInterval(timerInterval); timerRunning = false; btn.textContent = 'Resume';
  } else if (remaining > 0) {
    timerRunning = true; btn.textContent = 'Pause';
    timerInterval = setInterval(() => {
      remaining--;
      updateTimerDisplay();
      if (remaining <= 0) { clearInterval(timerInterval); timerRunning = false; btn.textContent = 'Start'; }
    }, 1000);
  }
}
function resetTimer() {
  clearInterval(timerInterval); timerRunning = false; remaining = totalSecs;
  document.getElementById('startBtn').textContent = 'Start';
  updateTimerDisplay();
}
updateTimerDisplay();

// Tab switching
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['words','score','timer'][i]===tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
}
</script>
